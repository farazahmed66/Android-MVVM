// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.2'

        classpath "com.google.dagger:hilt-android-gradle-plugin:2.59.2"

        classpath 'org.ow2.asm:asm:8.0'
        classpath 'org.ow2.asm:asm-util:8.0'
        classpath 'org.ow2.asm:asm-commons:8.0'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}